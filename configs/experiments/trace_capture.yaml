# Reasoning-trace capture for the Appendix G analysis: the three main-text
# models probed around their counting boundaries with the provider's reasoning
# stream stored into each trial's metadata. Small by design -- the traces are
# the data, not the capacities.
extends:
  - base.yaml
  - providers/openrouter.yaml
  - tasks/homogeneous_count.yaml
  - strategies/scan.yaml

run_name: trace-capture
provider:
  name: openrouter
  capture_reasoning: true

models:
  - {id: "anthropic/claude-sonnet-5", variant: think, reasoning_effort: medium, temperature_locked: true}
  - {id: "openai/gpt-5.6-terra", variant: think, reasoning_effort: medium, temperature_locked: true}
  - {id: "google/gemini-3.7-flash", reasoning_effort: medium}

max_output_tokens: 8192
retry_max_output_tokens: 8192
escalate_output_budget: false

# Around and past the smallest of the three boundaries (sonnet-5 at 92): from
# well inside the stable regime to about twice the largest boundary, sparsely.
search:
  start: 40
  step: 20
  stop: 700
  stop_after_consecutive_errors: 10
  stop_at_first_mistake_multiple: null
  stop_when_resolved: false
