extends: [base.yaml, providers/openrouter.yaml, strategies/scan.yaml]
models:
  - id: google/gemini-3.7-flash
    reasoning_effort: medium
task:
  name: run_structure
  probe: color_total
max_output_tokens: 8192
retry_max_output_tokens: 8192
escalate_output_budget: false
